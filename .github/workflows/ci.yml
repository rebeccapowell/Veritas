name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Veritas.sln
      - name: Build
        run: dotnet build Veritas.sln --configuration Release --no-restore
      - name: Pack
        run: dotnet pack src/Veritas/Veritas.csproj --configuration Release --no-restore --output ./NuGet
      - name: Test
        run: |
          dotnet test test/Veritas.Tests/Veritas.Tests.csproj --configuration Release --no-build \
            --logger trx \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"
      - name: Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines;MarkdownSummaryGitHub;Badges'
          tag: '${{ github.run_number }}'
      - name: Append coverage to job summary
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TestResults
          path: ./TestResults
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coveragereport
      - name: Upload NuGet package
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget
          path: ./NuGet/*.nupkg

  report:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: TestResults
          path: TestResults
      - uses: EnricoMi/publish-unit-test-result-action/linux@v2.25.0
        with:
          files: 'TestResults/**/*.trx'
