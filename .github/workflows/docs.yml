name: docs

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: install docfx
        run: dotnet tool restore

      - name: build docs
        run: dotnet tool run docfx docfx/docfx.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation
          path: docfx/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: documentation
          path: public
      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
